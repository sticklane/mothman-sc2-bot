name: Fetch AI Arena Replays

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max recent matches to download across selected Mothman bots (max 200)"
        required: false
        default: "40"
      bot_ids:
        description: "Target bots: 'all' (v1+v2+vc), 'v1', 'v2', 'vc', or comma-separated IDs/names"
        required: false
        default: "all"
      since_match:
        description: "Optional minimum numeric match ID (e.g. 5117325)"
        required: false
        default: ""
      since_date:
        description: "Optional minimum UTC date prefix YYYY-MM-DD (e.g. 2026-11-15)"
        required: false
        default: ""
      skip_matches:
        description: "Optional comma-separated match IDs already downloaded"
        required: false
        default: ""
      skip_downloads:
        description: "Set 'true' to fetch live standings/metadata only without downloading replays/logs"
        required: false
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: fetch-aiarena-replays
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Live Status, Replays, and Match Logs from AI Arena
        env:
          AIARENA_API_TOKEN: ${{ secrets.AIARENA_API_TOKEN }}
          LIMIT_STR: ${{ inputs.limit }}
          BOT_IDS_STR: ${{ inputs.bot_ids }}
          SINCE_MATCH_STR: ${{ inputs.since_match }}
          SINCE_DATE_STR: ${{ inputs.since_date }}
          SKIP_MATCHES_STR: ${{ inputs.skip_matches }}
          SKIP_DOWNLOADS_STR: ${{ inputs.skip_downloads }}
        run: |
          mkdir -p out_replays
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          BOT_IDS = {
              1457: "Mothman-R",
              1458: "Mothman-Z",
              1459: "Mothman-T",
              1460: "Mothman-P",
              1461: "Mothman-X",
              1505: "Mothman-Z2",
              1506: "Mothman-T2",
              1507: "Mothman-P2",
              1508: "Mothman-X2",
              1518: "Mothman-ZC",
              1519: "Mothman-TC",
              1520: "Mothman-PC",
              1521: "Mothman-XC",
          }
          V1_BOT_IDS = [1458, 1459, 1460, 1461]
          V2_BOT_IDS = [1505, 1506, 1507, 1508]
          VC_BOT_IDS = [1518, 1519, 1520, 1521]
          ALL_ACTIVE_BOT_IDS = V1_BOT_IDS + V2_BOT_IDS + VC_BOT_IDS
          USER_ID = 3871
          COMPETITION_ID = 38
          OUT_DIR = "out_replays"

          token = os.environ.get("AIARENA_API_TOKEN", "").strip()
          if not token:
              print("ERROR: AIARENA_API_TOKEN secret is empty", file=sys.stderr)
              sys.exit(1)

          raw_limit = os.environ.get("LIMIT_STR", "40").strip()
          limit = int(raw_limit) if raw_limit.isdigit() and int(raw_limit) > 0 else 40
          limit = min(limit, 200)
          raw_since = os.environ.get("SINCE_MATCH_STR", "").strip()
          since_match = int(raw_since) if raw_since.isdigit() else None
          since_date = os.environ.get("SINCE_DATE_STR", "").strip()
          raw_skip = os.environ.get("SKIP_MATCHES_STR", "")
          skip_mids = {int(x.strip()) for x in raw_skip.split(",") if x.strip().isdigit()}
          skip_downloads = os.environ.get("SKIP_DOWNLOADS_STR", "false").strip().lower() == "true"

          def resolve_query_bots(spec):
              s = (spec or "all").strip().lower()
              if not s or s == "all":
                  return list(ALL_ACTIVE_BOT_IDS)
              if s == "v1":
                  return list(V1_BOT_IDS)
              if s == "v2":
                  return list(V2_BOT_IDS)
              if s == "vc":
                  return list(VC_BOT_IDS)
              out = []
              by_lower = {v.lower(): k for k, v in BOT_IDS.items()}
              for tok in s.split(","):
                  t = tok.strip().lower()
                  if not t:
                      continue
                  if t == "v1":
                      out.extend(V1_BOT_IDS)
                  elif t == "v2":
                      out.extend(V2_BOT_IDS)
                  elif t == "vc":
                      out.extend(VC_BOT_IDS)
                  elif t.isdigit():
                      out.append(int(t))
                  elif t in by_lower:
                      out.append(by_lower[t])
                  elif f"mothman-{t}" in by_lower:
                      out.append(by_lower[f"mothman-{t}"])
              dedup = []
              for bid in out:
                  if bid not in dedup:
                      dedup.append(bid)
              return dedup or list(ALL_ACTIVE_BOT_IDS)

          QUERY_BOT_IDS = resolve_query_bots(os.environ.get("BOT_IDS_STR", "all"))
          QUERY_BOT_SET = set(QUERY_BOT_IDS)

          def safe_token(s):
              cleaned = re.sub(r"[^A-Za-z0-9._-]+", "_", str(s or ""))
              return cleaned or "Opponent"

          def api_get(url):
              full_url = url if url.startswith("http") else f"https://aiarena.net/api/{url.lstrip('/')}"
              for attempt in range(6):
                  time.sleep(0.30)
                  res = subprocess.run(
                      [
                          "curl", "-sL", "--max-time", "25",
                          "-w", "\n%{http_code}",
                          "-H", f"Authorization: Token {token}",
                          "-H", "User-Agent: mothman-racket-forensics/3.1",
                          full_url,
                      ],
                      capture_output=True,
                      text=True,
                  )
                  if res.returncode != 0:
                      wait_s = 2.5 * (attempt + 1)
                      print(f"  [WARN] curl rc={res.returncode} for {full_url}; retrying in {wait_s:.1f}s", file=sys.stderr)
                      time.sleep(wait_s)
                      continue
                  body, _, status_str = res.stdout.rpartition("\n")
                  http_code = int(status_str.strip()) if status_str.strip().isdigit() else 0
                  data = None
                  if body.strip():
                      try:
                          data = json.loads(body)
                      except Exception:
                          data = None
                  detail = str(data.get("detail", "")) if isinstance(data, dict) else ""
                  if http_code == 429 or http_code >= 500 or "throttled" in detail.lower():
                      m = re.search(r"Expected available in (\d+(?:\.\d+)?) seconds", detail)
                      wait_s = (float(m.group(1)) + 0.5) if m else min(20.0, 2.5 * (attempt + 1))
                      print(
                          f"  [RATE_LIMIT] HTTP {http_code} on {full_url}; retrying in {wait_s:.1f}s ({detail})",
                          file=sys.stderr,
                      )
                      time.sleep(wait_s)
                      continue
                  if http_code < 200 or http_code >= 300:
                      print(f"  [WARN] HTTP {http_code} on {full_url}: {body[:200]}", file=sys.stderr)
                      return None
                  return data
              print(f"  [ERROR] Exhausted retries for {full_url}", file=sys.stderr)
              return None

          def download_file(url, dest_path):
              if not url:
                  return False
              part_path = dest_path + ".part"
              for attempt in range(4):
                  time.sleep(0.20)
                  cmd = [
                      "curl", "-sL", "--max-time", "45",
                      "-w", "%{http_code}",
                      "-H", "User-Agent: mothman-racket-forensics/3.1",
                      "-o", part_path,
                  ]
                  if "aiarena.net" in url:
                      cmd.extend(["-H", f"Authorization: Token {token}"])
                  cmd.append(url)
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  http_code = int(res.stdout.strip()) if res.stdout.strip().isdigit() else 0
                  if res.returncode == 0 and 200 <= http_code < 300 and os.path.isfile(part_path) and os.path.getsize(part_path) > 0:
                      os.replace(part_path, dest_path)
                      return True
                  if os.path.isfile(part_path):
                      os.remove(part_path)
                  if http_code in (429, 500, 502, 503, 504) or res.returncode != 0:
                      wait_s = min(20.0, 2.5 * (attempt + 1))
                      print(
                          f"  [WARN] Download HTTP {http_code} (rc={res.returncode}) for {dest_path}; retrying in {wait_s:.1f}s",
                          file=sys.stderr,
                      )
                      time.sleep(wait_s)
                      continue
                  print(f"  [WARN] Download HTTP {http_code} failed for {url}", file=sys.stderr)
                  return False
              return False

          # 1. Live Bot & Competition Status (all user bots, caching participations)
          per_bot_limit = min(
              100,
              max(limit, 60) if (since_match is not None or since_date) else max(limit, 30),
          )
          mp_cache = {}
          summary_bots = []
          status_lines = [
              "============================================================================",
              f"  AI Arena Live Bot & Match Status (User #{USER_ID}, Competition #{COMPETITION_ID})",
              f"  Query bots: {[f'{BOT_IDS.get(b, b)}(#{b})' for b in QUERY_BOT_IDS]} | limit={limit}",
              "============================================================================",
          ]
          all_bots = []
          url = f"bots/?user={USER_ID}&limit=100"
          while url:
              bots_resp = api_get(url)
              if not isinstance(bots_resp, dict):
                  break
              all_bots.extend(bots_resp.get("results", []))
              url = bots_resp.get("next")

          for b in all_bots:
              bid = b.get("id")
              bname = b.get("name")
              if isinstance(bid, int) and isinstance(bname, str) and bname:
                  BOT_IDS.setdefault(bid, bname)
              btype = b.get("type")
              zupd = b.get("bot_zip_updated")
              zmd5 = b.get("bot_zip_md5hash")
              cp_resp = api_get(f"competition-participations/?bot={bid}&competition={COMPETITION_ID}")
              cp_list = cp_resp.get("results", []) if isinstance(cp_resp, dict) else []
              cp0 = cp_list[0] if cp_list else {}
              active = cp0.get("active")
              elo = cp0.get("elo")
              div_num = cp0.get("division_num")
              m_cnt = cp0.get("match_count")
              w_cnt = cp0.get("win_count")
              l_cnt = cp0.get("loss_count")
              t_cnt = cp0.get("tie_count")
              c_cnt = cp0.get("crash_count")
              w_perc = cp0.get("win_perc")
              record_str = (
                  f"{w_cnt}W-{l_cnt}L-{t_cnt}T (m={m_cnt}, crash={c_cnt}, wr={round(w_perc, 1) if isinstance(w_perc, (int, float)) else w_perc}%)"
                  if m_cnt is not None else "N/A"
              )
              status_lines.append(
                  f"  * {bname} (#{bid}, {btype}) | active={active} elo={elo if elo is not None else 'N/A'} "
                  f"div={div_num if div_num is not None else 'N/A'} rec={record_str} | updated={zupd} md5={zmd5}"
              )
              entry = {
                  "id": bid,
                  "name": bname,
                  "type": btype,
                  "plays_race": b.get("plays_race"),
                  "bot_zip_updated": zupd,
                  "bot_zip_md5hash": zmd5,
                  "competition_participation": cp0,
                  "recent_participations": [],
              }
              if active or bid in ALL_ACTIVE_BOT_IDS or bid in QUERY_BOT_SET:
                  mp_resp = api_get(f"match-participations/?bot={bid}&ordering=-match&limit={per_bot_limit}")
                  mp_list = mp_resp.get("results", []) if isinstance(mp_resp, dict) else []
                  mp_cache[bid] = mp_list
                  entry["recent_participations"] = mp_list
                  for p in mp_list[:8]:
                      mid = p.get("match")
                      res = p.get("result") or "QUEUED/IN_PROGRESS"
                      cause = p.get("result_cause") or "-"
                      elo_chg = p.get("elo_change") or 0
                      res_elo = p.get("resultant_elo")
                      step_s = p.get("avg_step_time")
                      step_str = f"{round(step_s * 1000.0, 2)}ms" if isinstance(step_s, (int, float)) else "N/A"
                      status_lines.append(
                          f"      - Match #{mid} (https://aiarena.net/matches/{mid}/): "
                          f"status={res} cause={cause} elo={res_elo}({elo_chg:+d}) step={step_str}"
                      )
              summary_bots.append(entry)

          status_text = "\n".join(status_lines) + "\n"
          print(status_text)
          with open(os.path.join(OUT_DIR, "live_status.txt"), "w", encoding="utf-8") as fh:
              fh.write(status_text)
          with open(os.path.join(OUT_DIR, "all_bots_summary.json"), "w", encoding="utf-8") as fh:
              json.dump({"user_id": USER_ID, "competition_id": COMPETITION_ID, "bots": summary_bots}, fh, indent=2)

          # 2. Discover recent COMPLETED match IDs across selected Mothman bots
          mids_set = set()
          for bid in QUERY_BOT_IDS:
              if bid not in mp_cache:
                  resp = api_get(f"match-participations/?bot={bid}&ordering=-match&limit={per_bot_limit}")
                  mp_cache[bid] = resp.get("results", []) if isinstance(resp, dict) else []
              for r in mp_cache[bid]:
                  if not isinstance(r, dict):
                      continue
                  if r.get("result") not in ("win", "loss", "tie") and not r.get("match_log"):
                      continue
                  mid = r.get("match")
                  if isinstance(mid, int) and mid > 0 and mid not in skip_mids:
                      mids_set.add(mid)

          all_mids = sorted(mids_set)
          if since_match is not None:
              selected_mids = [m for m in all_mids if m >= since_match][-limit:]
          elif since_date:
              selected_mids = sorted(all_mids, reverse=True)[:limit]
          else:
              selected_mids = all_mids[-limit:]

          print(f"[FETCH] Processing {len(selected_mids)} completed AI Arena match(es) (skip_downloads={skip_downloads}): {selected_mids}")

          known_names = dict(BOT_IDS)
          known_races = {}

          def resolve_bot_info(bot_id):
              if not isinstance(bot_id, int) or bot_id <= 0:
                  return "Opponent", ""
              if bot_id in known_names and bot_id in known_races:
                  return known_names[bot_id], known_races[bot_id]
              resp = api_get(f"bots/{bot_id}/")
              bname = resp.get("name") if isinstance(resp, dict) else None
              brace = resp.get("plays_race") if isinstance(resp, dict) else ""
              final_name = bname if isinstance(bname, str) and bname else known_names.get(bot_id, f"Bot{bot_id}")
              known_names[bot_id] = final_name
              known_races[bot_id] = brace if isinstance(brace, str) else ""
              return final_name, known_races[bot_id]

          def fetch_match(mid):
              res_resp = api_get(f"results/?match={mid}")
              res_list = res_resp.get("results", []) if isinstance(res_resp, dict) else []
              r0 = res_list[0] if res_list else {}
              created = r0.get("created") or ""
              if since_date and created and created[:10] < since_date:
                  print(f"  Match #{mid}: created={created} < {since_date}, skipping")
                  return "too_old"

              mp_resp = api_get(f"match-participations/?match={mid}")
              parts = mp_resp.get("results", []) if isinstance(mp_resp, dict) else []

              # Prefer a bot in QUERY_BOT_SET as our_part (handles v1-vs-v2 mirrors cleanly)
              our_part = next(
                  (p for p in parts if isinstance(p, dict) and p.get("bot") in QUERY_BOT_SET),
                  None,
              )
              if our_part is None:
                  our_part = next(
                      (p for p in parts if isinstance(p, dict) and p.get("bot") in BOT_IDS),
                      None,
                  )
              our_pid = our_part.get("id") if our_part else None
              opp_part = next(
                  (p for p in parts if isinstance(p, dict) and p.get("id") != our_pid),
                  None,
              )

              our_bid = our_part.get("bot") if our_part else None
              opp_bid = opp_part.get("bot") if opp_part else None
              our_bname = BOT_IDS.get(our_bid, f"Bot{our_bid}") if our_bid else "Mothman"
              opp_bname, opp_race = resolve_bot_info(opp_bid) if opp_bid else ("Opponent", "")
              both_ours = bool(our_bid in BOT_IDS and opp_bid in BOT_IDS)

              avg_step_sec = our_part.get("avg_step_time") if our_part else None
              avg_step_ms = round(avg_step_sec * 1000.0, 2) if isinstance(avg_step_sec, (int, float)) else 0.0
              our_elo_chg = (our_part.get("elo_change") if our_part else None) or 0
              our_res_elo = (our_part.get("resultant_elo") if our_part else None) or 0
              opp_elo_chg = (opp_part.get("elo_change") if opp_part else None) or 0
              opp_res_elo = (opp_part.get("resultant_elo") if opp_part else None) or 0

              meta = {
                  "match_id": mid,
                  "our_bot_id": our_bid or 0,
                  "our_bot_name": our_bname,
                  "our_bot_cohort": "v2" if our_bid in V2_BOT_IDS else ("v1" if our_bid in V1_BOT_IDS else "other"),
                  "opp_bot_id": opp_bid or 0,
                  "opp_bot_name": opp_bname,
                  "opp_plays_race": opp_race,
                  "both_ours": both_ours,
                  "our_participant_number": (our_part.get("participant_number") if our_part else None) or 0,
                  "result": (our_part.get("result") if our_part else None) or "in_progress",
                  "result_cause": (our_part.get("result_cause") if our_part else None) or "",
                  "elo_change": our_elo_chg,
                  "resultant_elo": our_res_elo,
                  "our_elo_before": (our_res_elo - our_elo_chg) if our_res_elo else 0,
                  "opp_result": (opp_part.get("result") if opp_part else None) or "",
                  "opp_result_cause": (opp_part.get("result_cause") if opp_part else None) or "",
                  "opp_elo_change": opp_elo_chg,
                  "opp_resultant_elo": opp_res_elo,
                  "opp_elo_before": (opp_res_elo - opp_elo_chg) if opp_res_elo else 0,
                  "avg_step_time_ms": avg_step_ms,
                  "match_log_url": (our_part.get("match_log") if our_part else None) or "",
                  "result_type": r0.get("type") or "",
                  "game_steps": r0.get("game_steps") or 0,
                  "replay_url": r0.get("replay_file") or "",
                  "created": created,
              }
              if not (our_bid or meta["replay_url"] or meta["match_log_url"]):
                  print(f"  [WARN] Match #{mid}: skipping empty/unpopulated API response", file=sys.stderr)
                  return "skipped"

              meta_path = os.path.join(OUT_DIR, f"{mid}_meta.json")
              with open(meta_path, "w", encoding="utf-8") as fh:
                  json.dump(meta, fh)

              log_ok = False
              rep_ok = False
              if not skip_downloads:
                  if meta["match_log_url"]:
                      log_ok = download_file(meta["match_log_url"], os.path.join(OUT_DIR, f"{mid}_match_log.zip"))
                  if meta["replay_url"]:
                      rep_name = f"{mid}_{safe_token(our_bname)}_vs_{safe_token(opp_bname)}.SC2Replay"
                      rep_ok = download_file(meta["replay_url"], os.path.join(OUT_DIR, rep_name))

              print(
                  f"  Match #{mid}: {our_bname}({meta['our_elo_before']}->{our_res_elo}) vs "
                  f"{opp_bname}({meta['opp_elo_before']}->{opp_res_elo}) | result={meta['result']} "
                  f"cause={meta['result_cause']} elo={our_elo_chg:+d} | replay={rep_ok} log={log_ok}"
              )
              return "downloaded"

          older_streak = 0
          for mid in selected_mids:
              st = fetch_match(mid)
              if st == "too_old":
                  older_streak += 1
                  if older_streak >= 16:
                      print(f"[FETCH] Stopping early after {older_streak} consecutive matches older than {since_date}")
                      break
              elif st == "downloaded":
                  older_streak = 0

          with open(os.path.join(OUT_DIR, "bot_names_cache.json"), "w", encoding="utf-8") as fh:
              json.dump({str(k): v for k, v in known_names.items()}, fh)
          PY

      - name: Upload Replays & Telemetry Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiarena-replays
          path: out_replays/
          retention-days: 7
          if-no-files-found: error
