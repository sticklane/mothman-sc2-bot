name: Deploy SC2 Bots to AI Arena

on:
  push:
    branches:
      - main
    paths:
      - "ladder/Mothman-*.zip"
  workflow_dispatch:
    inputs:
      bots:
        description: "Comma-separated bot names to deploy (or 'all')"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: deploy-aiarena
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Upload updated bot zips to AI Arena
        env:
          AIARENA_API_TOKEN: ${{ secrets.AIARENA_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BOTS: ${{ inputs.bots }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          BOT_MAP = {
              "ladder/Mothman-R.zip": (1457, "Mothman-R"),
              "ladder/Mothman-Z.zip": (1458, "Mothman-Z"),
              "ladder/Mothman-T.zip": (1459, "Mothman-T"),
              "ladder/Mothman-P.zip": (1460, "Mothman-P"),
              "ladder/Mothman-X.zip": (1461, "Mothman-X"),
          }

          token = os.environ.get("AIARENA_API_TOKEN", "").strip()
          if not token:
              print("ERROR: AIARENA_API_TOKEN secret is empty", file=sys.stderr)
              sys.exit(1)

          event_name = os.environ["EVENT_NAME"]
          targets = []

          if event_name == "workflow_dispatch":
              req = os.environ.get("DISPATCH_BOTS", "all").strip()
              if not req or req.lower() == "all":
                  targets = list(BOT_MAP.keys())
              else:
                  wanted = {x.strip() for x in req.split(",") if x.strip()}
                  targets = [p for p, (_, name) in BOT_MAP.items() if name in wanted]
          else:
              diff = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD~1", "HEAD"], text=True
              )
              changed = {line.strip() for line in diff.splitlines() if line.strip()}
              targets = [p for p in BOT_MAP if p in changed]

          if not targets:
              print("No matching ladder/Mothman-*.zip files to deploy.")
              sys.exit(0)

          for zip_path in targets:
              bot_id, bot_name = BOT_MAP[zip_path]
              if not os.path.isfile(zip_path):
                  print(f"Skipping missing file: {zip_path}")
                  continue

              print(f"Deploying {bot_name} (ID {bot_id}) from {zip_path}...")
              res = subprocess.run(
                  [
                      "curl",
                      "-sS",
                      "-w",
                      "\n%{http_code}",
                      "-X",
                      "PATCH",
                      "-H",
                      f"Authorization: Token {token}",
                      "-F",
                      f"bot_zip=@{zip_path}",
                      "-F",
                      "bot_data_enabled=true",
                      f"https://aiarena.net/api/bots/{bot_id}/",
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              body, _, status = res.stdout.rpartition("\n")
              status_code = int(status.strip())
              if not (200 <= status_code < 300):
                  print(f"ERROR deploying {bot_name}: HTTP {status_code}\n{body}", file=sys.stderr)
                  sys.exit(1)

              payload = json.loads(body)
              print(f"OK {bot_name} (ID {bot_id}): bot_zip_updated={payload.get('bot_zip_updated')}")
          PY
