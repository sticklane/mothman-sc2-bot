name: Deploy SC2 Bots to AI Arena

on:
  push:
    branches:
      - main
    paths:
      - "ladder/Mothman-*.zip"
  workflow_dispatch:
    inputs:
      bots:
        description: "Targets: 'all' (v1+v2+vc), 'v1', 'v2', 'vc', or comma-separated bot names/IDs/races"
        required: false
        default: "all"
      request_matches:
        description: "Number of new AI Arena matches to request across deployed bots (0 to skip)"
        required: false
        default: "8"
      opponents:
        description: "Opponent preset ('div3-5', 'div2-3', 'div1') or comma-separated names/IDs"
        required: false
        default: "div3-5"
      activate_competition:
        description: "Ensure Competition #38 participation is active for deployed bots"
        required: false
        default: "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: deploy-aiarena
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Upload v1 + v2 + vc BotZips, Activate Competition #38, and Request Matches
        env:
          AIARENA_API_TOKEN: ${{ secrets.AIARENA_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BOTS: ${{ inputs.bots }}
          REQUEST_MATCHES: ${{ inputs.request_matches }}
          OPPONENTS_SPEC: ${{ inputs.opponents }}
          ACTIVATE_COMPETITION: ${{ inputs.activate_competition }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.parse
          import zipfile

          # Each entry: (bot_id, bot_name, cohort, src_zip, base_name)
          BOT_SPECS = [
              (1458, "Mothman-Z",  "v1", "ladder/Mothman-Z.zip", "Mothman-Z"),
              (1459, "Mothman-T",  "v1", "ladder/Mothman-T.zip", "Mothman-T"),
              (1460, "Mothman-P",  "v1", "ladder/Mothman-P.zip", "Mothman-P"),
              (1461, "Mothman-X",  "v1", "ladder/Mothman-X.zip", "Mothman-X"),
              (1505, "Mothman-Z2", "v2", "ladder/Mothman-Z.zip", "Mothman-Z"),
              (1506, "Mothman-T2", "v2", "ladder/Mothman-T.zip", "Mothman-T"),
              (1507, "Mothman-P2", "v2", "ladder/Mothman-P.zip", "Mothman-P"),
              (1508, "Mothman-X2", "v2", "ladder/Mothman-X.zip", "Mothman-X"),
              (1518, "Mothman-ZC", "vc", "ladder/Mothman-Z.zip", "Mothman-Z"),
              (1519, "Mothman-TC", "vc", "ladder/Mothman-T.zip", "Mothman-T"),
              (1520, "Mothman-PC", "vc", "ladder/Mothman-P.zip", "Mothman-P"),
              (1521, "Mothman-XC", "vc", "ladder/Mothman-X.zip", "Mothman-X"),
          ]
          ALL_MANAGED_IDS = {b[0] for b in BOT_SPECS}
          COMPETITION_ID = 38
          DEFAULT_MAP_POOL_ID = 18
          USER_ID = 3871

          OPPONENT_PRESETS = {
              "div1": [(1256, "Atlas"), (248, "Eris"), (611, "Phobos"), (730, "Deimos")],
              "div2-3": ["Creepy_strategies", "Thssprtssbt", "Mulebot"],
              "div3-5": [
                  "Creepy_strategies",
                  "Thssprtssbt",
                  "sludgement2-revived",
                  "mini-puck",
                  "onlyfans",
                  "oberon",
                  "titania",
                  "who",
              ],
          }

          token = os.environ.get("AIARENA_API_TOKEN", "").strip()
          if not token:
              print("ERROR: AIARENA_API_TOKEN secret is empty", file=sys.stderr)
              sys.exit(1)

          def relay_id(type_name: str, obj_id: int) -> str:
              return base64.b64encode(f"{type_name}:{obj_id}".encode("utf-8")).decode("ascii")

          def decode_relay_id(b64: str):
              try:
                  raw = base64.b64decode(b64.strip()).decode("utf-8", errors="replace")
                  parts = raw.split(":", 1)
                  if len(parts) == 2 and parts[1].isdigit():
                      return parts[0], int(parts[1])
                  return parts[0], None
              except Exception:
                  return "", None

          def curl_json(args, timeout_s=None):
              is_upload = any(isinstance(a, str) and a.startswith("bot_zip=@") for a in args)
              eff_timeout = str(timeout_s if timeout_s is not None else (180 if is_upload else 45))
              last_code, last_body = 0, ""
              for attempt in range(6):
                  if attempt > 0:
                      time.sleep(0.3)
                  res = subprocess.run(
                      ["curl", "-sS", "--max-time", eff_timeout, "-w", "\n%{http_code}", *args],
                      capture_output=True,
                      text=True,
                  )
                  if res.returncode != 0:
                      wait_s = min(30.0, 2.5 * (attempt + 1))
                      last_code, last_body = 0, (res.stderr or "")[:400]
                      print(
                          f"  [WARN] curl rc={res.returncode} (attempt {attempt + 1}/6); retrying in {wait_s:.1f}s: {last_body}",
                          file=sys.stderr,
                      )
                      time.sleep(wait_s)
                      continue
                  body, _, status = res.stdout.rpartition("\n")
                  status_code = int(status.strip()) if status.strip().isdigit() else 0
                  last_code, last_body = status_code, body
                  detail = ""
                  if body.strip():
                      try:
                          parsed = json.loads(body)
                          if isinstance(parsed, dict):
                              detail = str(parsed.get("detail", ""))
                      except Exception:
                          detail = ""
                  if status_code == 429 or status_code >= 500 or "throttled" in detail.lower():
                      m = re.search(r"Expected available in (\d+(?:\.\d+)?) seconds", detail)
                      wait_s = (float(m.group(1)) + 0.5) if m else min(30.0, 2.5 * (attempt + 1))
                      print(
                          f"  [RATE_LIMIT/HTTP {status_code}] retrying in {wait_s:.1f}s ({detail[:160]})",
                          file=sys.stderr,
                      )
                      time.sleep(wait_s)
                      continue
                  return status_code, body
              return last_code, last_body

          def api_get(endpoint: str):
              url = endpoint if endpoint.startswith("http") else f"https://aiarena.net/api/{endpoint.lstrip('/')}"
              code, body = curl_json(["-H", f"Authorization: Token {token}", url])
              if not (200 <= code < 300):
                  return None
              try:
                  return json.loads(body)
              except Exception:
                  return None

          def graphql_post(query: str, variables: dict):
              payload = json.dumps({"query": query, "variables": variables})
              code, body = curl_json([
                  "-X", "POST",
                  "-H", f"Authorization: Token {token}",
                  "-H", "Content-Type: application/json",
                  "-d", payload,
                  "https://aiarena.net/graphql/",
              ])
              try:
                  parsed = json.loads(body)
              except Exception:
                  parsed = {"raw": body[:400], "http_status": code}
              return code, parsed

          def resolve_opponents(spec: str):
              key = (spec or "div3-5").strip().lower()
              if key in OPPONENT_PRESETS:
                  raw_entries = OPPONENT_PRESETS[key]
              else:
                  raw_entries = [x.strip() for x in spec.split(",") if x.strip()]
                  if not raw_entries:
                      raw_entries = OPPONENT_PRESETS["div3-5"]

              resolved = []
              for entry in raw_entries:
                  if isinstance(entry, tuple) and len(entry) == 2:
                      resolved.append(entry)
                  elif isinstance(entry, int) or (isinstance(entry, str) and entry.isdigit()):
                      oid = int(entry)
                      data = api_get(f"bots/{oid}/")
                      oname = data.get("name", f"Bot{oid}") if isinstance(data, dict) else f"Bot{oid}"
                      resolved.append((oid, oname))
                  elif isinstance(entry, str):
                      q = urllib.parse.quote(entry)
                      data = api_get(f"bots/?name={q}")
                      results = data.get("results", []) if isinstance(data, dict) else []
                      exact = next(
                          (b for b in results if isinstance(b, dict) and str(b.get("name", "")).lower() == entry.lower()),
                          results[0] if results and isinstance(results[0], dict) else None,
                      )
                      if exact and isinstance(exact.get("id"), int):
                          resolved.append((exact["id"], exact.get("name", entry)))
                      else:
                          print(f"WARN: Could not resolve opponent '{entry}', skipping")

              if not resolved:
                  print("WARN: Falling back to verified div1 opponents")
                  resolved = list(OPPONENT_PRESETS["div1"])
              return resolved

          def repack_named_zip(src_zip: str, base_name: str, target_name: str, out_zip: str, cheese_mode: bool = False, cheese_profile: str = "auto"):
              with zipfile.ZipFile(src_zip, "r") as zin, zipfile.ZipFile(out_zip, "w", compression=zipfile.ZIP_DEFLATED) as zout:
                  for info in zin.infolist():
                      data = zin.read(info.filename)
                      new_name = target_name if info.filename == base_name else info.filename
                      if new_name in ("config.json", "bot_config.json"):
                          cfg = json.loads(data.decode("utf-8"))
                          cfg["BotName"] = target_name
                          if cheese_mode:
                              cfg["CheeseMode"] = True
                              cfg["CheeseProfile"] = cheese_profile
                          data = (json.dumps(cfg, indent=2) + "\n").encode("utf-8")
                      elif new_name == "run.py":
                          txt = data.decode("utf-8")
                          txt = txt.replace(
                              '("Mothman", "Mothman-X", "Mothman-Z", "Mothman-T", "Mothman-P", "Mothman-R")',
                              f'("{target_name}", "Mothman", "Mothman-X", "Mothman-Z", "Mothman-T", "Mothman-P", "Mothman-R")',
                          )
                          data = txt.encode("utf-8")
                      zi = zipfile.ZipInfo(new_name, date_time=info.date_time)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.create_system = 3
                      zi.external_attr = info.external_attr
                      zout.writestr(zi, data)

              with tempfile.TemporaryDirectory() as td:
                  with zipfile.ZipFile(out_zip, "r") as zf:
                      for info in zf.infolist():
                          zf.extract(info, td)
                          mode = (info.external_attr >> 16) & 0o777
                          if mode:
                              os.chmod(os.path.join(td, info.filename), mode)
                  exe = os.path.join(td, target_name)
                  if not os.path.isfile(exe):
                      raise RuntimeError(f"Repacked zip missing root executable {target_name}")
                  res = subprocess.run([exe, "--dry-run"], cwd=td, capture_output=True, text=True, timeout=30)
                  if res.returncode != 0 or "DRY_RUN_OK" not in res.stdout:
                      raise RuntimeError(
                          f"Dry-run failed for {target_name}: rc={res.returncode} out={res.stdout[:300]} err={res.stderr[:300]}"
                      )
                  if cheese_mode:
                      parsed = None
                      for line in res.stdout.splitlines():
                          s = line.strip()
                          if s.startswith("{") and s.endswith("}"):
                              try:
                                  parsed = json.loads(s)
                                  break
                              except Exception:
                                  pass
                      if not isinstance(parsed, dict) or parsed.get("cheese_mode") is not True:
                          raise RuntimeError(f"Dry-run missing cheese_mode=true for {target_name}: {res.stdout[:300]}")
                      if base_name == "Mothman-X" and parsed.get("started_as_random") is not True:
                          raise RuntimeError(f"Dry-run missing started_as_random=true for {target_name}: {res.stdout[:300]}")
                  print(f"DRY_RUN_OK {target_name}: {res.stdout.strip()}")

          event_name = os.environ["EVENT_NAME"]
          if event_name == "workflow_dispatch":
              req = os.environ.get("DISPATCH_BOTS", "all").strip()
              if not req or req.lower() == "all":
                  targets = list(BOT_SPECS)
              else:
                  wanted = {x.strip().lower() for x in req.split(",") if x.strip()}
                  targets = [
                      spec for spec in BOT_SPECS
                      if spec[1].lower() in wanted
                      or str(spec[0]) in wanted
                      or spec[2].lower() in wanted
                      or spec[1].split("-")[-1].lower() in wanted
                      or spec[4].split("-")[-1].lower() in wanted
                  ]
          else:
              diff = subprocess.check_output(["git", "diff", "--name-only", "HEAD~1", "HEAD"], text=True)
              changed = {line.strip() for line in diff.splitlines() if line.strip()}
              targets = [spec for spec in BOT_SPECS if spec[3] in changed]

          deployed_bots = []
          os.makedirs("/tmp/deploy_repacked_zips", exist_ok=True)
          if not targets:
              print("No changed ladder/Mothman-*.zip files in commit; continuing to competition/match checks.")
          else:
              for bot_id, bot_name, cohort, src_zip, base_name in targets:
                  if not os.path.isfile(src_zip):
                      print(f"Skipping missing file: {src_zip}")
                      continue

                  upload_zip = src_zip
                  if bot_name != base_name:
                      upload_zip = f"/tmp/deploy_repacked_zips/{bot_name}.zip"
                      repack_named_zip(
                          src_zip,
                          base_name,
                          bot_name,
                          upload_zip,
                          cheese_mode=(cohort == "vc"),
                          cheese_profile="auto",
                      )

                  with open(upload_zip, "rb") as fh:
                      local_md5 = hashlib.md5(fh.read()).hexdigest()

                  print(f"Deploying {bot_name} ({cohort}, ID {bot_id}, local_md5={local_md5}) from {upload_zip}...")
                  code, body = curl_json([
                      "-X", "PATCH",
                      "-H", f"Authorization: Token {token}",
                      "-F", f"bot_zip=@{upload_zip}",
                      "-F", "bot_data_enabled=true",
                      f"https://aiarena.net/api/bots/{bot_id}/",
                  ])
                  if not (200 <= code < 300):
                      print(f"ERROR deploying {bot_name}: HTTP {code}\n{body}", file=sys.stderr)
                      sys.exit(1)

                  payload = json.loads(body)
                  if "bot_zip_md5hash" not in payload or not payload.get("bot_zip_updated"):
                      payload = api_get(f"bots/{bot_id}/") or payload
                  remote_md5 = payload.get("bot_zip_md5hash", "unknown")
                  print(
                      f"OK {bot_name} ({cohort}, ID {bot_id}): bot_zip_updated={payload.get('bot_zip_updated')} "
                      f"remote_md5={remote_md5} match={remote_md5 == local_md5}"
                  )
                  deployed_bots.append((bot_id, bot_name))

          active_bots = deployed_bots if deployed_bots else [(spec[0], spec[1]) for spec in BOT_SPECS]
          activate_flag = os.environ.get("ACTIVATE_COMPETITION", "true").strip().lower() != "false"
          if activate_flag:
              comp_gql = relay_id("CompetitionType", COMPETITION_ID)
              comp_mut = (
                  "mutation($input: UpdateCompetitionParticipationInput!) { "
                  "updateCompetitionParticipation(input: $input) { errors { field messages } } }"
              )
              for bid, bname, _, _, _ in BOT_SPECS:
                  code, resp = graphql_post(
                      comp_mut,
                      {"input": {"bot": relay_id("BotType", bid), "competition": comp_gql, "active": True}},
                  )
                  errs = ((resp.get("data") or {}).get("updateCompetitionParticipation") or {}).get("errors") or resp.get("errors")
                  if errs or code >= 400:
                      print(f"WARN competition activation {bname} (#{bid}): HTTP {code} {errs}")
                  else:
                      print(f"ACTIVE Competition #{COMPETITION_ID}: {bname} (#{bid})")

          raw_req_count = os.environ.get("REQUEST_MATCHES", "").strip()
          req_matches = int(raw_req_count) if raw_req_count.isdigit() else 8

          if req_matches > 0 and active_bots:
              opponents = resolve_opponents(os.environ.get("OPPONENTS_SPEC", "div3-5"))
              print(f"Resolved {len(opponents)} opponents: {[f'{n}(#{i})' for i, n in opponents]}")
              pool_gql = relay_id("MapPoolType", DEFAULT_MAP_POOL_ID)
              req_mut = (
                  "mutation($input: RequestMatchInput!) { "
                  "requestMatch(input: $input) { errors { field messages } match { id } } }"
              )
              ordered_bots = sorted(active_bots, key=lambda x: x[0])
              nb = len(ordered_bots)
              no = len(opponents)
              created_ids = []
              for idx in range(req_matches):
                  b_id, b_name = ordered_bots[idx % nb]
                  o_id, o_name = opponents[(idx + (idx // nb)) % no]
                  code, resp = graphql_post(
                      req_mut,
                      {
                          "input": {
                              "bot1": relay_id("BotType", b_id),
                              "bot2": relay_id("BotType", o_id),
                              "matchCount": 1,
                              "mapSelectionType": "map_pool",
                              "mapPool": pool_gql,
                          }
                      },
                  )
                  rm = (resp.get("data") or {}).get("requestMatch") or {}
                  errs = rm.get("errors") or resp.get("errors")
                  raw_match = rm.get("match")
                  if isinstance(raw_match, list):
                      match_objs = [m for m in raw_match if isinstance(m, dict)]
                  elif isinstance(raw_match, dict):
                      match_objs = [raw_match]
                  else:
                      match_objs = []
                  mids = []
                  for mo in match_objs:
                      m_relay = mo.get("id")
                      if isinstance(m_relay, str):
                          _, mid = decode_relay_id(m_relay)
                          if mid:
                              mids.append(mid)
                  if mids:
                      for mid in mids:
                          created_ids.append(mid)
                          print(f"REQUESTED Match #{mid}: {b_name} (#{b_id}) vs {o_name} (#{o_id}) -> https://aiarena.net/matches/{mid}/")
                  else:
                      print(f"WARN Match request failed ({b_name} vs {o_name}): HTTP {code} match={raw_match!r} errors={errs}")
                      if errs:
                          msg_text = json.dumps(errs).lower()
                          if "limit" in msg_text or "quota" in msg_text:
                              print("Stopping further match requests due to AI Arena match request limit.")
                              break

              if created_ids:
                  print(f"MATCH_REQUEST_SUMMARY: count={len(created_ids)} ids={','.join(str(x) for x in created_ids)}")

          bots_resp = api_get(f"bots/?user={USER_ID}&limit=100")
          if isinstance(bots_resp, dict):
              print("\n=== Live AI Arena Bot Verification Summary (v1 + v2) ===")
              for b in bots_resp.get("results", []):
                  if b.get("id") in ALL_MANAGED_IDS:
                      print(
                          f"  * {b.get('name')} (#{b.get('id')}): updated={b.get('bot_zip_updated')} "
                          f"md5={b.get('bot_zip_md5hash')}"
                      )
          PY
